# Checks on every push to main and every pull request. Four jobs, each a
# required check:
#
#   Lint                          hadolint, shellcheck, actionlint, markdownlint,
#                                 and the compose file -- the pre-commit hooks again
#   Omeka stack comes up          this repository's promise of a stable Omeka:
#                                 build from the pinned release, start, answer,
#                                 then install and seed it as scripts/reset.sh does
#   Trivy scan                    HIGH/CRITICAL fixed vulnerabilities in the built
#                                 image, and misconfiguration in Dockerfile and compose
#   Shared templates are current  cliff.toml and .githooks/commit-msg match
#                                 scattercode/release-pipelines
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: omeka/Dockerfile

      - name: Shell scripts
        run: shellcheck omeka/*.sh scripts/*.sh

      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Compose file
        run: docker compose --env-file .env.example config -q

  stack:
    name: Omeka stack comes up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Omeka answers with its installer
        run: |
          for _ in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:8080/ | grep -q "Omeka"; then
              echo "Omeka is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Install and seed
        run: |
          scripts/install.sh
          python3 scripts/seed.py

      - name: Every collection is in Omeka
        run: |
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, tomllib, urllib.request
          from pathlib import Path

          auth = (f"key_identity={os.environ['OMEKA_KEY_IDENTITY']}"
                  f"&key_credential={os.environ['OMEKA_KEY_CREDENTIAL']}")

          def count(resource):
              url = f"{os.environ['OMEKA_URL']}/api/{resource}?per_page=1&{auth}"
              with urllib.request.urlopen(url) as response:
                  return int(response.headers["Omeka-S-Total-Results"])

          manifests = [tomllib.loads(p.read_text())
                       for p in Path("collections").glob("*/collection.toml")]
          expected = {
              "sites": sum(1 for m in manifests if "site" in m),
              "item_sets": len(manifests),
              "items": sum(len(m["items"]) for m in manifests),
              "media": sum(len(i.get("media", [])) for m in manifests for i in m["items"]),
          }
          actual = {resource: count(resource) for resource in expected}
          print(actual)
          assert actual == expected, f"expected {expected}"
          EOF

      - name: Every site shows its items in the reader
        run: |
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, urllib.request

          auth = (f"key_identity={os.environ['OMEKA_KEY_IDENTITY']}"
                  f"&key_credential={os.environ['OMEKA_KEY_CREDENTIAL']}")
          base = os.environ["OMEKA_URL"]

          def get(url):
              with urllib.request.urlopen(url) as response:
                  return response.read().decode()

          for site in json.loads(get(f"{base}/api/sites?{auth}")):
              items = json.loads(get(f"{base}/api/items?site_id={site['o:id']}&per_page=1&{auth}"))
              assert items, f"site {site['o:slug']} has no items"
              page = get(f"{base}/s/{site['o:slug']}/item/{items[0]['o:id']}")
              assert "<octopusviewer-viewer" in page, f"no viewer on {site['o:slug']}"
              print(f"{site['o:slug']}: viewer on item {items[0]['o:id']}")
          EOF

      - name: Seeding again changes nothing
        run: |
          python3 scripts/seed.py | tee seed.log
          ! grep -E "created|uploaded" seed.log

      # Tetrak's core install and Tesseract only: the demo's own backends pull
      # several gigabytes of models, and the write-back path is the same
      # whichever engine reads the page. Keep the tag in step with the guide.
      - name: Install Tetrak
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          python3 -m venv /tmp/tetrak
          /tmp/tetrak/bin/pip install 'tetrak==5.16.0'

      - name: Transcribe a page and write it back
        run: |
          export PATH="/tmp/tetrak/bin:$PATH"
          python3 scripts/transcribe.py --item graumans-chinese-theatre --backend tesseract-auto
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request

          query = urllib.parse.urlencode({
              "property[0][property]": "dcterms:identifier",
              "property[0][type]": "eq",
              "property[0][text]": "graumans-chinese-theatre",
              "key_identity": os.environ["OMEKA_KEY_IDENTITY"],
              "key_credential": os.environ["OMEKA_KEY_CREDENTIAL"],
          })
          base = f"{os.environ['OMEKA_URL']}/api"
          item = json.load(urllib.request.urlopen(f"{base}/items?{query}"))[0]
          media = json.load(urllib.request.urlopen(item["o:media"][0]["@id"] + "?" + query))
          assert media.get("tetrak:transcript"), "no Tetrak transcript written"
          assert media.get("dcterms:title"), "the write-back lost the page's title"
          print(media["tetrak:transcribedWith"][0]["@value"])
          EOF

      # tutorials/searchable-pdf-drop-in.md: Tetrak's searchable PDF uploaded
      # as a plain file, read by Extract Text's pdftotext, found by Omeka's own
      # search. The word searched for is taken from the extracted text, so a
      # different Tesseract reading the sheet differently does not fail it.
      - name: A searchable PDF is found by Omeka's search
        run: |
          /tmp/tetrak/bin/tetrak-ocr ocr \
            collections/los-angeles-ephemera/hollywood-music-box-playbill-1926.png \
            --pdf /tmp/playbill.pdf > /dev/null
          set -a; . ./.omeka-api.env; set +a
          PYTHONPATH=scripts python3 - <<'EOF'
          import json, re
          from pathlib import Path
          from seed import Omeka, credentials

          omeka = Omeka(*credentials())
          item = omeka.find_by_identifier("items", "hollywood-music-box-playbill-1926")
          media = omeka.post_with_file(
              "media", {"o:ingester": "upload", "file_index": 0, "o:item": {"o:id": item["o:id"]}},
              Path("/tmp/playbill.pdf"),
          )
          text = (media.get("extracttext:extracted_text") or [{}])[0].get("@value", "")
          assert text, "Extract Text read nothing from the PDF"
          described = json.dumps(item).lower()
          word = next(w for w in re.findall(r"[A-Za-z]{7,}", text) if w.lower() not in described)
          found = [i["o:id"] for i in omeka.get("items", fulltext_search=word)]
          assert item["o:id"] in found, f"searching for {word!r} did not find the playbill"
          print(f"{len(text)} characters extracted; {word!r} finds the playbill")
          EOF

      # tutorials/import-a-manifest.md: Tetrak's batch manifest loaded by CSV
      # Import, through the same two admin forms the guide fills in, posted
      # over HTTP. Each row finds its media by file name in dcterms:identifier;
      # the ruined scan has no media and is skipped.
      - name: A batch manifest imports with CSV Import
        run: |
          mkdir -p /tmp/folder/workspace/scans
          cp collections/los-angeles-ephemera/*.jpg collections/los-angeles-ephemera/*.png \
             folder/inside-facts-1930-cover-ruined.jpg /tmp/folder/workspace/scans/
          (cd /tmp/folder && /tmp/tetrak/bin/tetrak-ocr batch --backend tesseract --manifest > /dev/null)
          set -a; . ./.env; . ./.omeka-api.env; set +a
          MANIFEST=/tmp/folder/workspace/manifest.csv python3 - <<'EOF'
          import csv, http.cookiejar, json, os, time, urllib.parse, urllib.request, uuid
          from html.parser import HTMLParser
          from pathlib import Path

          base = os.environ["OMEKA_URL"]
          auth = (f"key_identity={os.environ['OMEKA_KEY_IDENTITY']}"
                  f"&key_credential={os.environ['OMEKA_KEY_CREDENTIAL']}")
          manifest = Path(os.environ["MANIFEST"])
          browser = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))

          class Hidden(HTMLParser):
              """A form's hidden inputs: its CSRF token, and on the mapping
              screen the uploaded file's details, carried to the next step."""
              def __init__(self, html):
                  super().__init__(); self.fields = {}; self.feed(html)
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if (tag == "input" and a.get("type") == "hidden" and a.get("name")
                          and "disabled" not in a and not a["name"].startswith("column-")):
                      self.fields[a["name"]] = a.get("value") or ""

          def page(path, fields=None, upload=None):
              if fields is None:
                  return browser.open(base + path).read().decode()
              if upload is None:
                  body = urllib.parse.urlencode(fields).encode()
                  kind = "application/x-www-form-urlencoded"
              else:
                  boundary = uuid.uuid4().hex
                  body = b"".join(
                      f'--{boundary}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode()
                      for k, v in fields.items())
                  body += (f'--{boundary}\r\nContent-Disposition: form-data; name="{upload[0]}"; '
                           f'filename="{upload[1].name}"\r\nContent-Type: text/csv\r\n\r\n').encode()
                  body += upload[1].read_bytes() + f"\r\n--{boundary}--\r\n".encode()
                  kind = f"multipart/form-data; boundary={boundary}"
              request = urllib.request.Request(base + path, body, {"Content-Type": kind})
              return browser.open(request).read().decode()

          def api(path):
              return json.load(urllib.request.urlopen(f"{base}/api/{path}&{auth}"))

          page("/login", {**Hidden(page("/login")).fields, "submit": "Log in",
                          "email": os.environ["OMEKA_ADMIN_EMAIL"],
                          "password": os.environ["OMEKA_ADMIN_PASSWORD"]})
          jobs = len(api("jobs?per_page=1000"))

          # Screen one: the file, as Media.
          token = {k: v for k, v in Hidden(page("/admin/csvimport")).fields.items() if "csrf" in k}
          mapping = page("/admin/csvimport/map",
                         {**token, "resource_type": "media", "delimiter": ",", "enclosure": '"',
                          "automap_check_names_alone": "0", "comment": ""},
                         upload=("source", manifest))
          assert "transcript" in mapping, "CSV Import did not read the manifest's columns"

          # Screen two: the guide's three mappings and its advanced settings.
          with manifest.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          column = list(rows[0]).index
          prop = lambda term: api(f"properties?term={term}")[0]["o:id"]
          page("/admin/csvimport/map", {
              **Hidden(mapping).fields,
              f"column-property[{column('file')}][]": prop("dcterms:identifier"),
              f"column-property[{column('transcript')}][]": prop("tetrak:transcript"),
              f"column-property[{column('engine')}][]": prop("tetrak:transcribedWith"),
              "basic-settings[o:is_public]": 1,
              "basic-settings[multivalue_separator]": ",",
              "advanced-settings[action]": "revise",
              "advanced-settings[identifier_column]": column("file"),
              "advanced-settings[identifier_property]": "dcterms:identifier",
              "advanced-settings[action_unidentified]": "skip",
              "advanced-settings[rows_by_batch]": 20,
          })

          for _ in range(30):
              found = api("jobs?per_page=1000")
              if len(found) > jobs and found[-1]["o:status"] not in ("starting", "in_progress"):
                  break
              time.sleep(2)
          job = found[-1]
          assert job["o:job_class"].startswith("CSVImport") and job["o:status"] == "completed", job

          for row in rows:
              query = urllib.parse.urlencode({
                  "property[0][property]": "dcterms:identifier",
                  "property[0][type]": "eq", "property[0][text]": row["file"]})
              media = api(f"media?{query}")
              if row["file"].endswith("-ruined.jpg"):
                  assert not media, "the ruined scan has no media to update"
                  continue
              (media,) = media
              # CSV Import trims the trailing newlines a transcript ends with.
              assert media["tetrak:transcript"][0]["@value"] == row["transcript"].strip(), row["file"]
              assert media["tetrak:transcribedWith"][0]["@value"] == row["engine"], row["file"]
              assert media.get("dcterms:title"), f"the import lost {row['file']}'s title"
              print(f"{row['file']}: {len(row['transcript'])} characters")
          EOF

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t tetrak/omeka-s:ci omeka

      # The base image often lags Debian's security fixes; the Dockerfile
      # applies them, and this fails if one with a fix is still missing.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tetrak/omeka-s:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan Dockerfile and compose
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          exit-code: "1"
          severity: HIGH,CRITICAL

  # cliff.toml and .githooks/commit-msg are copies of the shared templates in
  # scattercode/release-pipelines. They have to be real files here -- git-cliff
  # reads one from the repository root and git runs the other from the
  # checkout -- so this is what stops a copy drifting unnoticed.
  templates:
    name: Shared templates are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared templates
        uses: actions/checkout@v7
        with:
          repository: scattercode/release-pipelines
          ref: v1
          path: .release-pipelines

      - name: Compare
        run: ./.release-pipelines/sync.sh --check .
