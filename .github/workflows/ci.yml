# Checks on every push to main and every pull request. Four jobs, each a
# required check:
#
#   Lint                          hadolint, shellcheck, actionlint, markdownlint,
#                                 and the compose file -- the pre-commit hooks again
#   Omeka stack comes up          this repository's promise of a stable Omeka:
#                                 build from the pinned release, start, answer,
#                                 then install and seed it as scripts/reset.sh does
#   Trivy scan                    HIGH/CRITICAL fixed vulnerabilities in the built
#                                 image, and misconfiguration in Dockerfile and compose
#   Shared templates are current  cliff.toml and .githooks/commit-msg match
#                                 scattercode/release-pipelines
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: omeka/Dockerfile

      - name: Shell scripts
        run: shellcheck omeka/*.sh scripts/*.sh

      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Compose file
        run: docker compose --env-file .env.example config -q

  stack:
    name: Omeka stack comes up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Omeka answers with its installer
        run: |
          for _ in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:8080/ | grep -q "Omeka"; then
              echo "Omeka is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Install and seed
        run: |
          scripts/install.sh
          python3 scripts/seed.py

      - name: Every collection is in Omeka
        run: |
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, tomllib, urllib.request
          from pathlib import Path

          auth = (f"key_identity={os.environ['OMEKA_KEY_IDENTITY']}"
                  f"&key_credential={os.environ['OMEKA_KEY_CREDENTIAL']}")

          def count(resource):
              url = f"{os.environ['OMEKA_URL']}/api/{resource}?per_page=1&{auth}"
              with urllib.request.urlopen(url) as response:
                  return int(response.headers["Omeka-S-Total-Results"])

          manifests = [tomllib.loads(p.read_text())
                       for p in Path("collections").glob("*/collection.toml")]
          expected = {
              "sites": sum(1 for m in manifests if "site" in m),
              "item_sets": len(manifests),
              "items": sum(len(m["items"]) for m in manifests),
              "media": sum(len(i.get("media", [])) for m in manifests for i in m["items"]),
          }
          actual = {resource: count(resource) for resource in expected}
          print(actual)
          assert actual == expected, f"expected {expected}"
          EOF

      - name: Every site shows its items in the reader
        run: |
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, urllib.request

          auth = (f"key_identity={os.environ['OMEKA_KEY_IDENTITY']}"
                  f"&key_credential={os.environ['OMEKA_KEY_CREDENTIAL']}")
          base = os.environ["OMEKA_URL"]

          def get(url):
              with urllib.request.urlopen(url) as response:
                  return response.read().decode()

          for site in json.loads(get(f"{base}/api/sites?{auth}")):
              items = json.loads(get(f"{base}/api/items?site_id={site['o:id']}&per_page=1&{auth}"))
              assert items, f"site {site['o:slug']} has no items"
              page = get(f"{base}/s/{site['o:slug']}/item/{items[0]['o:id']}")
              assert "<octopusviewer-viewer" in page, f"no viewer on {site['o:slug']}"
              print(f"{site['o:slug']}: viewer on item {items[0]['o:id']}")
          EOF

      - name: Seeding again changes nothing
        run: |
          python3 scripts/seed.py | tee seed.log
          ! grep -E "created|uploaded" seed.log

      # Tetrak's core install and Tesseract only: the demo's own backends pull
      # several gigabytes of models, and the write-back path is the same
      # whichever engine reads the page. Keep the tag in step with the guide.
      - name: Install Tetrak
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
          python3 -m venv /tmp/tetrak
          /tmp/tetrak/bin/pip install 'tetrak==5.14.1'

      - name: Transcribe a page and write it back
        run: |
          export PATH="/tmp/tetrak/bin:$PATH"
          python3 scripts/transcribe.py --item graumans-chinese-theatre --backend tesseract-auto
          set -a; . ./.omeka-api.env; set +a
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request

          query = urllib.parse.urlencode({
              "property[0][property]": "dcterms:identifier",
              "property[0][type]": "eq",
              "property[0][text]": "graumans-chinese-theatre",
              "key_identity": os.environ["OMEKA_KEY_IDENTITY"],
              "key_credential": os.environ["OMEKA_KEY_CREDENTIAL"],
          })
          base = f"{os.environ['OMEKA_URL']}/api"
          item = json.load(urllib.request.urlopen(f"{base}/items?{query}"))[0]
          media = json.load(urllib.request.urlopen(item["o:media"][0]["@id"] + "?" + query))
          assert media.get("tetrak:transcript"), "no Tetrak transcript written"
          assert media.get("dcterms:title"), "the write-back lost the page's title"
          print(media["tetrak:transcribedWith"][0]["@value"])
          EOF

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t tetrak/omeka-s:ci omeka

      # The base image often lags Debian's security fixes; the Dockerfile
      # applies them, and this fails if one with a fix is still missing.
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: tetrak/omeka-s:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan Dockerfile and compose
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          exit-code: "1"
          severity: HIGH,CRITICAL

  # cliff.toml and .githooks/commit-msg are copies of the shared templates in
  # scattercode/release-pipelines. They have to be real files here -- git-cliff
  # reads one from the repository root and git runs the other from the
  # checkout -- so this is what stops a copy drifting unnoticed.
  templates:
    name: Shared templates are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the shared templates
        uses: actions/checkout@v7
        with:
          repository: scattercode/release-pipelines
          ref: v1
          path: .release-pipelines

      - name: Compare
        run: ./.release-pipelines/sync.sh --check .
