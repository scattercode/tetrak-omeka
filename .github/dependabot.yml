# Keeps the workflow actions and the pinned base images current. Omeka itself
# is pinned by version and checksum in omeka/Dockerfile and is upgraded by
# hand (see the README): Dependabot cannot compute the checksum.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/omeka"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # Our own image, built locally from omeka/ and on no registry; looking it
      # up failed the whole job. The docker ecosystem above covers its base.
      - dependency-name: "tetrak/omeka-s"
