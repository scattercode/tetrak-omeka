# As in Tetrak's site, which matches scattercode.dev.
config:
  MD013: false
  MD060: false
  # Repeated headings are fine when they sit under different parents.
  MD024:
    siblings_only: true

# CHANGELOG.md is generated by git-cliff on every release, from the template
# synced from scattercode/release-pipelines, and must not be edited by hand.
# Linting it can only fail where nothing here can fix it: the file ends with
# a second blank line (MD012), which failed the 0.1.0 release commit on main.
#
# That blank line is load-bearing, so do not fix it in the template. The
# release job adds each version with `git cliff --prepend`, which writes only
# the new section, and the "\n" closing the template's body is the only thing
# separating it from the section below. Without it, every release runs
# straight into the one before; with it at the start of the body instead, the
# extra blank line moves to the top. Checked with git-cliff 2.13.1 and 2.14.2.
ignores:
  - CHANGELOG.md
