# As in Tetrak's site, which matches scattercode.dev.
config:
  MD013: false
  MD060: false
  # Repeated headings are fine when they sit under different parents.
  MD024:
    siblings_only: true

# CHANGELOG.md is generated by git-cliff on every release, from the template
# synced from scattercode/release-pipelines, and must not be edited by hand.
# Linting it can only fail where nothing here can fix it: the template ends
# the file with a second blank line (MD012), which failed the 0.1.0 release
# commit on main.
ignores:
  - CHANGELOG.md
