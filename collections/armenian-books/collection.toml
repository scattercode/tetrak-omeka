class = "bibo:Document"

[items.metadata]
"dcterms:title" = { value = "Կիկոսի մահը", lang = "hy" }
"dcterms:alternative" = { value = "The Death of Kikos", lang = "en" }
"dcterms:creator" = [{ value = "Հովհաննես Թումանյան", lang = "hy" }, { value = "Hovhannes Tumanyan", lang = "en" }]
"dcterms:created" = "1913"
"dcterms:type" = "Tale"
"dcterms:language" = "hy"
"dcterms:isPartOf" = [{ value = "Երկերի լիակատար ժողովածու, հատոր 5 (1994)", lang = "hy" }, { value = "Complete works, volume 5 (1994)", lang = "en" }]
"dcterms:extent" = "4 pages (scan pages 252–255, printed pages 246–249)"
"dcterms:description" = """\
The 1913 tale, complete. A poor family's eldest daughter, sent for water, \
imagines the son she might one day have, Kikos, climbing the tall tree by \
the spring and falling to his death, and sits down to mourn him. Her two \
sisters and then her mother follow and join in, until her father, the wisest \
of them, takes them home to hold Kikos's wake and slaughters the family's only ox \
for it. A single column of italic type with verse laments set into the \
prose."""
"dcterms:rights" = "Public domain: Tumanyan died in 1923. Marked PD-old on Wikimedia Commons."
"dcterms:license" = { uri = "https://creativecommons.org/publicdomain/mark/1.0/", label = "Public Domain Mark 1.0" }
