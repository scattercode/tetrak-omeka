# Armenian printed books: proofread pages from two volumes, scanned on
# Wikimedia Commons and transcribed on Armenian Wikisource. A proofread
# transcript exists for every page. Provenance and rights are in SOURCES.md
# beside this file; the format is in ../README.md.
#
# Each item is a run of pages, each page one of its media, in reading order.
# Pages are titled by their printed page number. The scan page, the page's
# position in the DjVu scan and what Wikisource numbers by, is in each page's
# source label; in the Tumanyan volume it is 6 more than the printed number.

[item_set]
identifier = "armenian-books"
class = "dctype:Collection"

[item_set.metadata]
"dcterms:title" = "Armenian printed books"
"dcterms:description" = """\
Pages from two twentieth-century Armenian books: ten pages of the Soviet \
Armenian Encyclopedia, set in three narrow columns of small type, and the \
whole of Hovhannes Tumanyan's tale "Brave Nazar" from the 1994 academic \
edition of his complete works. Every page has a proofread transcript on \
Armenian Wikisource, so OCR of them can be scored."""
"dcterms:language" = "hy"

[site]
slug = "armenian-books"
title = "Armenian printed books"
summary = "Pages from the Soviet Armenian Encyclopedia and the whole of Hovhannes Tumanyan's tale Brave Nazar, each shown beside its proofread Wikisource transcript."
introduction = """\
<p>Two Armenian books, read page by page: ten pages of the Soviet Armenian \
Encyclopedia (1976), three narrow columns of small type to a page, and the \
whole of Hovhannes Tumanyan's tale <em>Brave Nazar</em> (Քաջ Նազարը), as \
printed in the 1994 academic edition of his complete works.</p>
<p>Open an item and page through it: each scan sits beside its reference \
transcript, proofread by volunteers on Armenian Wikisource. The encyclopedia \
is © the Armenian Encyclopedia Publishing House under CC BY-SA 3.0; \
Tumanyan's tale is in the public domain.</p>"""

