# The Los Angeles stage and its picture palaces: three items from Tetrak's
# OCR evaluation corpus, copied from it byte for byte. Provenance and rights
# are in SOURCES.md beside this file; the format is in ../README.md.

[item_set]
identifier = "los-angeles-ephemera"
class = "dctype:Collection"

[item_set.metadata]
"dcterms:title" = "Los Angeles stage and screen ephemera"
"dcterms:description" = """\
Vaudeville posters, trade papers and postcards of Hollywood's picture \
palaces, from about 1914 to 1945. Display type, ornament, dense \
multi-column newsprint and small signage in photographs: the kind of \
material that general-purpose OCR handles worst. All three items are in \
Tetrak's evaluation corpus, with human-verified transcripts."""
"dcterms:spatial" = "Los Angeles, California"
"dcterms:temporal" = "c. 1914–1945"

[site]
slug = "los-angeles"
title = "Los Angeles stage and screen"
summary = "Posters, trade papers and postcards from Los Angeles's theatres and picture palaces, about 1914 to 1945, each shown beside a verified transcript."
introduction = """\
<p>Three pieces of Los Angeles stage and screen ephemera: a vaudeville \
poster, the front page of a theatrical trade weekly, and a postcard of \
Hollywood Boulevard. Display type, ornament, dense newsprint and small \
signage in a photograph are what general-purpose OCR handles worst, which is \
why all three are in Tetrak's evaluation corpus.</p>
<p>Open an item to see the scan beside its reference transcript, checked \
by hand against the original.</p>"""

