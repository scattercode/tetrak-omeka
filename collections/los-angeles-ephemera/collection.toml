class = "bibo:Image"

[items.metadata]
"dcterms:title" = "The great Victorina Troupe, originators and presenters of the most marvelous sword swallowing act on earth"
"dcterms:date" = "c. 1914"
"dcterms:type" = "Poster"
"dcterms:medium" = "Chromolithograph"
"dcterms:description" = """\
Vaudeville poster for a sword-swallowing act, crowded with lettering of \
many sizes. The title is the Library of Congress catalogue's, after the \
performer Victorina named in the captions; the printed headline reads \
"See the great Kar-Mi Troupe". The Library of Congress colour calibration bar and ruler are \
left in frame. Downscaled from the 4104 × 5116 pixel source to 1123 × 1400 \
for Tetrak's corpus."""
"dcterms:alternative" = "See the great Kar-Mi Troupe"
"dcterms:publisher" = "Donaldson Litho. Co., Newport, Kentucky"
"dcterms:isPartOf" = "Library of Congress theatrical poster collection"
"dcterms:source" = { uri = "https://commons.wikimedia.org/wiki/File:The_great_Victorina_Troupe_originators_and_presenters_of_the_most_marvelous_sword_swallowing_act_on_earth._LCCN2014636914.jpg", label = "Wikimedia Commons, from the Library of Congress (LCCN 2014636914)" }
"dcterms:rights" = "Library of Congress: no known restrictions on publication. Published before 1929."
"dcterms:license" = { uri = "https://creativecommons.org/publicdomain/mark/1.0/", label = "Public Domain Mark 1.0" }

